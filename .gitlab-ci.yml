image: node:18

stages:
  - build           # local stage
  - deploy          # pulled in from remote include

# -------- BUILD --------
build:
  stage: build
  script:
    - npm ci
    - npm run build     # Docusaurus
  artifacts:
    paths: [build/]

# -------- INCLUDE REMOTE DEPLOY JOB --------
include:
  - project: 'cognitivemetrics/wiki-deploy'      # <namespace>/<project>
    file: 'deploy.yml'
    ref: main                                # pin to a branch or tag