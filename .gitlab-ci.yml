image: node:18

stages:
  - build
  - deploy

cache:
  key: node-modules
  paths:
    - node_modules/

variables:
  NODE_ENV: production
  RSYNC_FLAGS: "-az --delete"

# ───────────────────────── build static site
build:
  stage: build
  script:
    - npm ci
    - npm run build            # → ./build
  artifacts:
    paths:
      - build/
    expire_in: 1 week

# ───────────────────────── deploy via rsync over SSH
deploy_static_site:
  stage: deploy
  needs: ["build"]             # pulls the artifact ZIP
  image: alpine:latest         # small image with ssh + rsync
  before_script:
    - apk add --no-cache openssh-client rsync
    - mkdir -p ~/.ssh
    - eval "$(ssh-agent -s)"
    # SSH_PRIVATE_KEY is a *File* variable → its value is the temp filename
    - install -m 600 "$SSH_PRIVATE_KEY" ~/.ssh/id_rsa
    - ssh-add ~/.ssh/id_rsa
    - ssh-keyscan -H "$SSH_HOST" >> ~/.ssh/known_hosts
  script:
    - rsync $RSYNC_FLAGS build/ "$SSH_USER@$SSH_HOST:$SSH_TARGET_DIR"
  rules:
    - if: $CI_COMMIT_BRANCH == "main"        # deploys only from main
  environment:
    name: production
    url: https://cognitivemetrics.co/wiki/