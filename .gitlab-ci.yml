image: node:18

stages:
  - build
  - deploy

variables:
  DEPLOY_SSH: "${SSH_USER}@${SSH_HOST}"

build:
  stage: build
  script:
    - npm ci
    - npm run build
  artifacts:
    paths:
      - build/

deploy:
  stage: deploy
  needs: ["build"]
  image: alpine:latest
  before_script:
    - apk add --no-cache openssh rsync
    - test -n "$SSH_USER"  && test -n "$SSH_HOST" && test -n "$SSH_TARGET_DIR" \
        || { echo "Missing SSH_* variables"; exit 1; }
    - mkdir -p ~/.ssh && chmod 700 ~/.ssh
    - eval "$(ssh-agent -s)"
    - chmod 600 "$SSH_PRIVATE_KEY"
    - ssh-add   "$SSH_PRIVATE_KEY"
    - ssh-keyscan -H "$SSH_HOST" >> ~/.ssh/known_hosts
  script:
    - echo "Deploying to $DEPLOY_SSH:$SSH_TARGET_DIR"
    - rsync -az --delete build/ "$DEPLOY_SSH:$SSH_TARGET_DIR"
  only:
    - main
