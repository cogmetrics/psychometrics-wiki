image: node:18
stages: [build, trigger-deploy]

build:
  stage: build
  script:
    - npm ci
    - npm run build
  artifacts:
    paths: [build/]

deploy_trigger:
  stage: trigger-deploy
  needs: ["build"]
  trigger:
    project: cognitivemetrics/wiki-deploy
    branch: main
    token: $TRIGGER_TOKEN
    strategy: depend