image: node:18

stages:
  - build
  - trigger-deploy          # runs only after a successful build

cache:
  key: node-modules
  paths:
    - node_modules/

variables:
  NODE_ENV: production

# ───────────────────────────────────────────────────────────── build
build:
  stage: build
  script:
    - npm ci
    - npm run build          # → ./build
  artifacts:
    paths:
      - build/
    expire_in: 1 week

# ─────────────────────────────────────────────────── trigger deploy
deploy_trigger:
  stage: trigger-deploy
  needs: ["build"]           # wait until the build artifact exists
  trigger:
    project: cognitivemetrics/wiki-deploy   # downstream repo
    branch: main
    strategy: depend         # parent waits for the downstream result
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
