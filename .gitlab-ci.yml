image: node:18

stages:
  - build
  - deploy

variables:
  DEPLOY_SSH: "${SSH_USER}@${SSH_HOST}"

build:
  stage: build
  script:
    - npm ci
    - npm run build
  artifacts:
    paths: [build/]

deploy:
  stage: deploy
  needs: ["build"]
  image: alpine:latest
  before_script:
    - apk add --no-cache openssh rsync
    - eval "$(ssh-agent -s)"
    - ssh-add "$SSH_PRIVATE_KEY"
    - ssh-keyscan -H "$SSH_HOST" >> ~/.ssh/known_hosts
  script:
    - rsync -az --delete build/ "$DEPLOY_SSH:$SSH_TARGET_DIR"
  only:
    - main
