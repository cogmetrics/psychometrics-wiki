image: node:18

stages:
  - build
  - deploy

variables:
  DEPLOY_SSH: "${SSH_USER}@${SSH_HOST}"

# ---------- BUILD ----------
build:
  stage: build
  script:
    - npm ci
    - npm run build
  artifacts:
    paths:
      - build/

# ---------- DEPLOY ----------
deploy:
  stage: deploy
  needs: ["build"]
  image: alpine:latest
  before_script:
    - apk add --no-cache openssh rsync
    # fail fast if any variable is blank
    - '[ -n "$SSH_USER" ] && [ -n "$SSH_HOST" ] && [ -n "$SSH_TARGET_DIR" ] || { echo "ERROR: one or more SSH_* variables are empty"; exit 1; }'
    - mkdir -p ~/.ssh && chmod 700 ~/.ssh
    - eval "$(ssh-agent -s)"
    - chmod 600 "$SSH_PRIVATE_KEY"
    - ssh-add "$SSH_PRIVATE_KEY"
    - ssh-keyscan -H "$SSH_HOST" >> ~/.ssh/known_hosts
  script:
    - echo "Deploying to $DEPLOY_SSH:$SSH_TARGET_DIR"
    - rsync -az --delete build/ "$DEPLOY_SSH:$SSH_TARGET_DIR"
  only:
    - main
