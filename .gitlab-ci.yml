image: node:18

stages:
  - build
  - trigger-deploy   # only runs after a successful build

cache:
  key: node-modules
  paths: [node_modules/]

variables:
  NODE_ENV: production

build:
  stage: build
  script:
    - npm ci
    - npm run build           # → ./build
  artifacts:
    paths: [build/]
    expire_in: 1 week

deploy_trigger:
  stage: trigger-deploy
  needs: ["build"]            # wait for the artifact
  trigger:
    project: cognitivemetrics/wiki-deploy
    branch: main
    file: deploy.yml          # tell the child project which file to run
    strategy: depend          # bubble the status up
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
